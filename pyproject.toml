[project]
# Not a package: a flowverse is a repository with a `flows/` directory in it, each flow
# of which humanize runs by path. This file is here for what checks them -- the linter,
# the type checker and the tests -- and for the one dependency they all have, which is
# humanize itself. Nothing here is read by humanize: only `flows/` is.
name = "flowverse"
version = "0.1.0"
description = "The flows humanize offers but does not ship"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["hmz", "pydantic>=2.9"]

[tool.uv]
package = false

[tool.uv.sources]
hmz = { git = "https://github.com/humanfia/humanize" }

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8",
    "pytest-timeout>=2.3",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config", "-ra"]
# humanize runs a flow with its own directory on `sys.path`, so a flow may import what
# came with it -- `_humanize1`, here. A test imports the flow itself, so it needs that
# same directory, and `flows/` is where the flows are.
pythonpath = ["flows"]

[tool.ruff]
line-length = 88
# Where a module imported by name lives: `flows/`, which is what humanize puts on
# `sys.path` while it runs one, and so what a flow importing `_humanize1` -- or a test
# importing the flow -- is reaching for. Without it they sort as somebody else's.
src = [".", "flows"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # The formatter owns trailing commas and implicit concatenation.
    "COM812",
    "ISC001",
    # LICENSE says it once.
    "CPY001",
    # Google style leaves the class docstring to cover __init__ and the dunders.
    "D102",
    "D105",
    "D107",
    # A flow imports what only it needs, where it needs it.
    "PLC0415",
    "ANN401",
    # The message reads better at the raise than three files away.
    "TRY003",
    "EM101",
    "EM102",
    "S603",
    "S607",
    # A loop over an agent is one shape, and splitting it to bring a number down
    # hides the shape.
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
# A flow is a module with its entry points in it, and the module docstring is about
# them -- how the flow loops, what each agent is for, and the line that starts it.
# What a flow prints is what it says: the interface captures everything printed under
# it into the transcript, so a warning a flow has to give is a `print`.
# `flows/` is a directory of flows rather than a package: humanize runs what is in it
# by path, so there is nothing for an `__init__.py` to do.
"flows/**" = ["D103", "INP001", "T201"]
# pytest's hooks: what each is called and when it runs is pytest's to document.
"conftest.py" = ["D103"]
"tests/**" = [
    "S101",    # an assert is what a test is
    "SLF001",  # a test reaches for what it tests, private or not
    "PLR2004", # the literal a test compares against is the expectation
    "D1",      # the name of a test is what it documents
    "ARG",     # pytest passes a fixture by name, whether the body names it or not
    "FBT",     # a parametrized test takes its parameters however `parametrize` gives them
    "S108",    # and a fake temp path
]

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["."]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"

[[tool.pyright.executionEnvironments]]
root = "tests"
# A test imports the flow it tests, which is where a flow's own imports are resolved
# from too: `flows/` is on the path for the same reason humanize puts it there.
extraPaths = [".", "flows"]
reportPrivateUsage = "none"
reportUnusedFunction = "none"

[[tool.pyright.executionEnvironments]]
root = "flows"
extraPaths = ["flows"]
