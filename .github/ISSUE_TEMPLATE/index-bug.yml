name: Index bug
description: Something wrong with the index itself, its schema, its CI, or its documentation.
title: "[Index]: "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What is wrong
      description: What you expected, what happened instead, and where (a file, a workflow run, a page).
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to see it
      description: Steps, a link to a failing run, or the command and its output.
      render: text
