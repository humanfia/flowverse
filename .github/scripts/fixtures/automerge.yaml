# Cases automerge.py decides, each from the facts below with some of them replaced:
#   uv run .github/scripts/automerge.py --fixture .github/scripts/fixtures/automerge.yaml
# `expect` is merge or wait (the default); `because` is part of the reason a case waits;
# `deletes` is the branch deleted once it is merged, null for none.
facts:
  repo: humanfia/flowverse
  pull: &pull {number: 7, state: open, draft: false, base: main, head: &head aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa,
               branch: feat/aot-0.1.1, from: humanfia/flowverse}
  default: main
  run: {event: pull_request, conclusion: success, head_sha: *head, path: .github/workflows/validate.yml}
  jobs: &jobs
    lint: success
    validate: success
    verify: success
    install aot 0.1.1: success
    index-ok: success
  files:
    flows/aot/0.1.1/flow.yaml: added
  truncated: false
  base:
    flows/aot/0.1.0/flow.yaml: &aot |
      name: aot
      version: 0.1.0
      description: The flow that writes a flow.
      repo: humanfia/aot-flow
      ref: v0.1.0
      commit: 009db348737af610758fa495c8fb3890ff98fab9
      subdir: aot
      license: Apache-2.0
    flows/aot/0.0.9/flow.yaml: null
    flows/alice/kernel/0.1.0/flow.yaml: |
      name: kernel
      version: 0.1.0
      description: Tunes a kernel.
      repo: Alice/kernel-flow
      ref: v0.1.0
      commit: 1111111111111111111111111111111111111111
      license: MIT
      dependencies:
        humanize1: ">=0.1.0,<0.2.0"
  head:
    flows/aot/0.1.1/flow.yaml: &bump |
      name: aot
      version: 0.1.1
      description: The flow that writes a flow.
      repo: humanfia/aot-flow
      ref: v0.1.1
      commit: 2222222222222222222222222222222222222222
      subdir: aot
      license: Apache-2.0
  withdrawn: []
  # What each repository says of the versions the cases below add: the commit the tag `ref`
  # points at, and how GitHub compares `commit` with the newest version's.
  upstream:
    flows/aot/0.1.1/flow.yaml: &ahead {tagged: "2222222222222222222222222222222222222222", compared: ahead}
    flows/aot/0.1.2/flow.yaml: {tagged: "4444444444444444444444444444444444444444", compared: ahead}
    flows/alice/kernel/0.2.0-rc.1/flow.yaml: {tagged: "3333333333333333333333333333333333333333",
                                              compared: ahead}

cases:
  - name: a new version of a flow of humanfia's
    expect: merge
    deletes: feat/aot-0.1.1

  - name: from a fork, whose branch is its owner's
    expect: merge
    pull: {<<: *pull, branch: main, from: alice/flowverse}
    deletes: null

  - name: from a fork deleted since
    expect: merge
    pull: {<<: *pull, from: null}
    deletes: null

  - name: a new version of a namespaced flow
    expect: merge
    jobs: {lint: success, validate: success, verify: success, install alice/kernel 0.2.0-rc.1: success,
           index-ok: success}
    files: {flows/alice/kernel/0.2.0-rc.1/flow.yaml: added}
    head:
      flows/alice/kernel/0.2.0-rc.1/flow.yaml: |
        name: kernel
        version: 0.2.0-rc.1
        description: Tunes a kernel.
        repo: Alice/kernel-flow
        ref: v0.2.0-rc.1
        commit: 3333333333333333333333333333333333333333
        license: MIT
        dependencies:
          humanize1: ">=0.1.0,<0.2.0"

  - name: two versions at once
    expect: merge
    jobs: {<<: *jobs, install aot 0.1.2: success}
    files: {flows/aot/0.1.1/flow.yaml: added, flows/aot/0.1.2/flow.yaml: added}
    head:
      flows/aot/0.1.1/flow.yaml: *bump
      flows/aot/0.1.2/flow.yaml: |
        name: aot
        version: 0.1.2
        description: The flow that writes a flow.
        repo: humanfia/aot-flow
        ref: v0.1.2
        commit: 4444444444444444444444444444444444444444
        subdir: aot
        license: Apache-2.0

  - name: a published version modified
    because: "`flows/aot/0.1.0/flow.yaml` is modified"
    files: {flows/aot/0.1.1/flow.yaml: added, flows/aot/0.1.0/flow.yaml: modified}

  - name: a published version deleted
    because: "is removed"
    files: {flows/aot/0.1.1/flow.yaml: added, flows/aot/0.0.9/flow.yaml: removed}

  - name: a version renamed
    because: "is renamed"
    files: {flows/aot/0.1.1/flow.yaml: renamed}

  - name: another file beside the manifest
    because: "`README.md` is modified"
    files: {flows/aot/0.1.1/flow.yaml: added, README.md: modified}

  - name: another file in the version directory
    because: "`flows/aot/0.1.1/notes.md` is added"
    files: {flows/aot/0.1.1/flow.yaml: added, flows/aot/0.1.1/notes.md: added}

  - name: a workflow added
    because: "`.github/workflows/x.yml` is added"
    files: {flows/aot/0.1.1/flow.yaml: added, .github/workflows/x.yml: added}

  - name: a new flow
    because: "`bob/kernel` is a new flow"
    jobs: {<<: *jobs, install bob/kernel 0.1.0: success}
    files: {flows/bob/kernel/0.1.0/flow.yaml: added}
    head:
      flows/bob/kernel/0.1.0/flow.yaml: |
        name: kernel
        version: 0.1.0
        description: Tunes a kernel.
        repo: bob/kernel-flow
        ref: v0.1.0
        commit: 5555555555555555555555555555555555555555
        license: MIT

  - name: a withdrawn version published again
    because: "`aot` 0.1.1 was published before, and withdrawn"
    withdrawn: [flows/aot/0.1.1/flow.yaml]

  - name: a withdrawn version of a namespaced flow published again, at another commit
    because: "`alice/kernel` 0.2.0 was published before, and withdrawn"
    jobs: {<<: *jobs, install alice/kernel 0.2.0: success}
    files: {flows/alice/kernel/0.2.0/flow.yaml: added}
    withdrawn: [flows/alice/kernel/0.2.0/flow.yaml]
    head:
      flows/alice/kernel/0.2.0/flow.yaml: |
        name: kernel
        version: 0.2.0
        description: Tunes a kernel.
        repo: Alice/kernel-flow
        ref: v0.2.0
        commit: 7777777777777777777777777777777777777777
        license: MIT
        dependencies:
          humanize1: ">=0.1.0,<0.2.0"

  - name: a version older than the newest
    because: "`aot` 0.0.10 is not newer than 0.1.0"
    jobs: {<<: *jobs, install aot 0.0.10: success}
    files: {flows/aot/0.0.10/flow.yaml: added}
    head: {flows/aot/0.0.10/flow.yaml: *aot}

  - name: a prerelease of the newest
    because: "is not newer than 0.1.0"
    jobs: {<<: *jobs, install aot 0.1.0-rc.1: success}
    files: {flows/aot/0.1.0-rc.1/flow.yaml: added}
    head: {flows/aot/0.1.0-rc.1/flow.yaml: *aot}

  - name: the repository changed
    because: "`aot` 0.1.1 changes repo from 0.1.0"
    head:
      flows/aot/0.1.1/flow.yaml: |
        name: aot
        version: 0.1.1
        description: The flow that writes a flow.
        repo: humanfia/aot-fork
        ref: v0.1.1
        commit: 2222222222222222222222222222222222222222
        subdir: aot
        license: Apache-2.0

  - name: the subdirectory changed
    because: "changes subdir from"
    head:
      flows/aot/0.1.1/flow.yaml: |
        name: aot
        version: 0.1.1
        description: The flow that writes a flow.
        repo: humanfia/aot-flow
        ref: v0.1.1
        commit: 2222222222222222222222222222222222222222
        subdir: other
        license: Apache-2.0

  - name: the subdirectory left out
    because: "changes subdir from"
    head:
      flows/aot/0.1.1/flow.yaml: |
        name: aot
        version: 0.1.1
        description: The flow that writes a flow.
        repo: humanfia/aot-flow
        ref: v0.1.1
        commit: 2222222222222222222222222222222222222222
        license: Apache-2.0

  - name: the license changed
    because: "changes license from"
    head:
      flows/aot/0.1.1/flow.yaml: |
        name: aot
        version: 0.1.1
        description: The flow that writes a flow.
        repo: humanfia/aot-flow
        ref: v0.1.1
        commit: 2222222222222222222222222222222222222222
        subdir: aot
        license: MIT

  - name: a dependency added
    because: "changes dependencies from"
    head:
      flows/aot/0.1.1/flow.yaml: |
        name: aot
        version: 0.1.1
        description: The flow that writes a flow.
        repo: humanfia/aot-flow
        ref: v0.1.1
        commit: 2222222222222222222222222222222222222222
        subdir: aot
        license: Apache-2.0
        dependencies:
          humanize1: ">=0.1.0"

  - name: a dependency's range changed
    because: "`alice/kernel` 0.1.1 changes dependencies from 0.1.0"
    jobs: {<<: *jobs, install alice/kernel 0.1.1: success}
    files: {flows/alice/kernel/0.1.1/flow.yaml: added}
    head:
      flows/alice/kernel/0.1.1/flow.yaml: |
        name: kernel
        version: 0.1.1
        description: Tunes a kernel.
        repo: Alice/kernel-flow
        ref: v0.1.1
        commit: 6666666666666666666666666666666666666666
        license: MIT
        dependencies:
          humanize1: ">=0.1.0,<0.3.0"

  - name: the description changed
    because: "changes description from"
    head:
      flows/aot/0.1.1/flow.yaml: |
        name: aot
        version: 0.1.1
        description: Something else entirely.
        repo: humanfia/aot-flow
        ref: v0.1.1
        commit: 2222222222222222222222222222222222222222
        subdir: aot
        license: Apache-2.0

  - name: tagged without a v
    expect: merge
    head:
      flows/aot/0.1.1/flow.yaml: |
        name: aot
        version: 0.1.1
        description: The flow that writes a flow.
        repo: humanfia/aot-flow
        ref: 0.1.1
        commit: 2222222222222222222222222222222222222222
        subdir: aot
        license: Apache-2.0

  - name: an older commit, rolling the flow back
    because: "commit 2222222 does not come after 009db34, 0.1.0's: GitHub compares it as behind"
    upstream: {flows/aot/0.1.1/flow.yaml: {<<: *ahead, compared: behind}}

  - name: the newest version's commit again
    because: "GitHub compares it as identical"
    upstream: {flows/aot/0.1.1/flow.yaml: {<<: *ahead, compared: identical}}

  - name: a commit on another line than the newest version's
    because: "GitHub compares it as diverged"
    upstream: {flows/aot/0.1.1/flow.yaml: {<<: *ahead, compared: diverged}}

  - name: a commit the repository does not share history with
    because: "GitHub compares it as unrelated"
    upstream: {flows/aot/0.1.1/flow.yaml: {tagged: "2222222222222222222222222222222222222222"}}

  - name: an older tag as a new version
    because: "`aot` 0.1.1 is at ref `v0.1.0`, not at its tag `v0.1.1`"
    head:
      flows/aot/0.1.1/flow.yaml: |
        name: aot
        version: 0.1.1
        description: The flow that writes a flow.
        repo: humanfia/aot-flow
        ref: v0.1.0
        commit: 009db348737af610758fa495c8fb3890ff98fab9
        subdir: aot
        license: Apache-2.0

  - name: a newer tag as a far newer version, holding the versions after it
    because: "`aot` 99.0.0 is at ref `v0.1.1`, not at its tag `v99.0.0`"
    jobs: {<<: *jobs, install aot 99.0.0: success}
    files: {flows/aot/99.0.0/flow.yaml: added}
    head:
      flows/aot/99.0.0/flow.yaml: |
        name: aot
        version: 99.0.0
        description: The flow that writes a flow.
        repo: humanfia/aot-flow
        ref: v0.1.1
        commit: 2222222222222222222222222222222222222222
        subdir: aot
        license: Apache-2.0
    upstream: {flows/aot/99.0.0/flow.yaml: *ahead}

  - name: a branch
    because: "is at ref `main`, not at its tag `v0.1.1`"
    head:
      flows/aot/0.1.1/flow.yaml: |
        name: aot
        version: 0.1.1
        description: The flow that writes a flow.
        repo: humanfia/aot-flow
        ref: main
        commit: 2222222222222222222222222222222222222222
        subdir: aot
        license: Apache-2.0

  - name: a commit by itself, perhaps a fork's
    because: "is at ref `2222222222222222222222222222222222222222`, not at its tag `v0.1.1`"
    head:
      flows/aot/0.1.1/flow.yaml: |
        name: aot
        version: 0.1.1
        description: The flow that writes a flow.
        repo: humanfia/aot-flow
        ref: 2222222222222222222222222222222222222222
        commit: 2222222222222222222222222222222222222222
        subdir: aot
        license: Apache-2.0

  - name: a tag the repository does not have
    because: "`aot` 0.1.1's tag `v0.1.1` of humanfia/aot-flow is not there"
    upstream: {flows/aot/0.1.1/flow.yaml: {compared: ahead}}

  - name: a tag at another commit
    because: "`aot` 0.1.1's tag `v0.1.1` of humanfia/aot-flow is at 3c4c415, not 2222222"
    upstream: {flows/aot/0.1.1/flow.yaml: {<<: *ahead, tagged: "3c4c415e5983bac91ad54dc1a8fa2b1bf7619025"}}

  - name: the install job did not run
    because: "validate ran no install aot 0.1.1"
    jobs: {lint: success, validate: success, verify: success, index-ok: success}

  - name: the install job failed
    because: "install aot 0.1.1 (failure)"
    jobs: {<<: *jobs, install aot 0.1.1: failure}

  - name: validate failed
    because: "validate did not pass"
    run: {event: pull_request, conclusion: failure, head_sha: *head, path: .github/workflows/validate.yml}

  - name: another workflow called validate
    because: "the run is not .github/workflows/validate.yml"
    run: {event: pull_request, conclusion: success, head_sha: *head, path: .github/workflows/x.yml}

  - name: pushed to since validate ran
    because: "its head is bbbbbbb"
    pull: {<<: *pull, head: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb}

  - name: a draft
    because: "it is a draft"
    pull: {<<: *pull, draft: true}

  - name: into another branch
    because: "it is not into main"
    pull: {<<: *pull, base: next}

  - name: too many files to list
    because: "more than 300 files"
    truncated: true

  - name: nothing changed
    because: "it changes nothing"
    files: {}
    jobs: {lint: success, validate: success, verify: success, index-ok: success}
